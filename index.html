<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assam Land Exchange – Prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5efe2;--card:#fff;--ink:#1b2a22;--mute:#5c6a62;--line:#dde2da;--brand:#17623f;--brand-ink:#fff;--accent:#c8312b;--ok:#1f7a45;--okbg:#e3f3e9;--warn:#9a6a00;--warnbg:#fff1d0;--bad:#b3261e;--badbg:#fde3e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111713;--card:#1a221d;--ink:#e8eee9;--mute:#9aa9a0;--line:#2b372f;--brand:#3fa878;--brand-ink:#08150e;--accent:#ee6a62;--ok:#6fd49a;--okbg:#17321f;--warn:#f0c35a;--warnbg:#3a2f12;--bad:#ff8f86;--badbg:#3d1b18}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111713;--card:#1a221d;--ink:#e8eee9;--mute:#9aa9a0;--line:#2b372f;--brand:#3fa878;--brand-ink:#08150e;--accent:#ee6a62;--ok:#6fd49a;--okbg:#17321f;--warn:#f0c35a;--warnbg:#3a2f12;--bad:#ff8f86;--badbg:#3d1b18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:var(--card);border-top:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}.logo span{color:var(--brand)}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:10px}
nav button{border:0;background:none;color:var(--mute);font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--brand);color:var(--brand-ink)}
header::before{content:"";display:block;height:9px;background:repeating-linear-gradient(90deg,#c8312b 0 16px,#fff 16px 20px,#c8312b 20px 36px,#1b2a22 36px 40px)}
h1,h3,.logo{font-family:Georgia,"Noto Serif Bengali","Noto Serif",serif}
.hero{position:relative;overflow:hidden;border-radius:16px;margin:18px 0 6px;min-height:340px}.scene{position:absolute;inset:0;width:100%;height:100%}
.heroin{position:relative;margin:22px;padding:16px 20px;max-width:540px;background:color-mix(in srgb,var(--card) 90%,transparent);border-radius:12px}
.hero h1{font-size:27px;line-height:1.25;margin:0 0 8px}.hero p{color:var(--mute);margin:0}
.banner{margin:16px 0;padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid .card{margin:0}
.card h3{margin:0 0 4px;font-size:17px}.meta{color:var(--mute);font-size:14px}.price{font-weight:700;font-size:20px;margin:8px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--brand)}.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%;width:100%}
.row select{width:auto}label{display:block;font-size:14px;color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.checks{list-style:none;padding:0;margin:12px 0}.checks li{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.checks small{display:block;color:var(--mute)}.score{font-size:32px;font-weight:700}
.map{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:760px){.two{grid-template-columns:1.2fr 1fr}}
.table{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}
footer{color:var(--mute);font-size:13px;padding:24px 0 40px}
.log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);word-break:break-all;margin-top:10px}
.pin{cursor:pointer}
.topbar{background:#222;color:#fff;font-size:13px;padding:6px 0}.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .btn{padding:2px 10px;font-size:13px;background:none;color:#fff;border-color:#888}
.hero2{position:relative;min-height:520px;color:#fff;overflow:hidden;background:#17382a}
.hero2 .scene{position:absolute;inset:0;width:100%;height:100%}
.hero2::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,25,18,.75),rgba(10,25,18,.4) 45%,rgba(10,25,18,.3))}
.hnav,.hcenter{position:relative;z-index:2}
.hnav{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:14px;padding-bottom:10px}
.hnav .logo{color:#fff}.hnav .logo span{color:inherit}#lg{color:#ff9d2e}
.hnav nav{padding:0}.hnav nav button{color:#fff}.hnav nav button.on{background:rgba(255,255,255,.2);color:#fff}
.hnav nav button:last-child{background:#ff8a1f;color:#fff;font-weight:600}
.hcenter{text-align:center;padding:90px 16px 70px;max-width:820px;margin:0 auto}
.hcenter h1{font:800 46px/1.15 system-ui,"Noto Sans Bengali",sans-serif;margin:0 0 12px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45)}.hl{color:#ff9d2e}
.hcenter p{font-size:19px;margin:0 0 24px;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.5)}
.sbar{display:flex;background:#fff;border-radius:6px;overflow:hidden;max-width:620px;margin:0 auto}.sbar input{border:0;border-radius:0;color:#222;background:#fff;padding:14px 16px}
.sbar button{border:0;background:#fff;color:#444;padding:0 18px;cursor:pointer}
.hero2.compact{min-height:0;background:#17382a}.hero2.compact .scene,.hero2.compact .hcenter{display:none}.hero2.compact::after{display:none}
.tick{background:var(--card);border-bottom:1px solid var(--line)}.tick .wrap{display:flex;gap:14px;align-items:center;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.tick b{letter-spacing:.04em;font-size:14px}.tick span{flex:1;min-width:200px;font-size:15px}
@media(max-width:640px){.hcenter h1{font-size:32px}.hcenter{padding-top:50px}}
.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s}.sl.on{opacity:1}
@media(max-width:640px){#slot,#slot+span{display:none}}
.heart{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mute);padding:0}.heart.on{color:var(--accent)}
.badge.sold{background:var(--line);color:var(--mute)}.ck{display:flex;gap:6px;align-items:center}.ck input{width:auto}
.stp{list-style:none;display:flex;gap:6px;padding:0;margin:12px 0;flex-wrap:wrap}.stp li{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.stp li.done{background:var(--okbg);color:var(--ok);border-color:transparent}.stp li.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
</style>
</head>

function cards(){var l=P.map(function(p,i){return i}).filter(function(i){var p=P[i];return (!F.d||p.dist===F.d)&&(!F.c||p.c[2][2].indexOf(F.c)===0)&&(!F.m||p.price<=F.m)&&(!F.v||p.status==="verified")&&(!F.sv||SV[i])&&(!Q||(p.loc+" "+p.dist+" "+p.id).toLowerCase().indexOf(Q)>=0)});
if(F.s==="pa")l.sort(function(a,b){return P[a].price-P[b].price});else if(F.s==="pd")l.sort(function(a,b){return P[b].price-P[a].price});else if(F.s==="sc")l.sort(function(a,b){return score(P[b])-score(P[a])});else l.reverse();
$("g").innerHTML=l.length?l.map(function(i){var p=P[i],d=Math.round((p.price-p.gv)/p.gv*100),dl=dealOf(i);
return '<div class="card"><div class="row" style="margin:0 0 6px;justify-content:space-between">'+badge(p.sold?"sold":p.status)+'<button class="heart'+(SV[i]?" on":"")+'" data-h="'+i+'" aria-label="'+t("save")+'">'+(SV[i]?"♥":"♡")+'</button></div><h3>'+p.loc+', '+p.dist+'</h3><div class="meta">'+t("parcel")+' '+p.id+' · '+p.area+' · '+t(cl(p))+'</div><div class="price">'+inr(p.price)+'</div><div class="meta">'+t("guide")+' '+inr(p.gv)+' ('+(d>=0?"+":"")+d+'%) · '+t("score")+' '+score(p)+'/100</div><div class="row"><button class="btn" data-i="'+i+'">'+t("view")+'</button><button class="btn ghost" data-e="'+i+'" '+(p.status==="flagged"||p.sold?"disabled":"")+'>'+(dl?t("opendeal"):t("enq"))+'</button></div></div>'}).join(""):'<div class="card">'+t("nores")+'</div>';
$("g").querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;cur="check";render()}});
$("g").querySelectorAll("[data-h]").forEach(function(b){b.onclick=function(){var i=+b.dataset.h;SV[i]=!SV[i];cards()}});
$("g").querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){NQ=+b.dataset.e;if(U)cur="deals";else{NX="deals";cur="login"}render()}})}
function gate(d){var p=P[d.p],r=p.rc||{};if(d.step===2&&p.status!=="verified")return "needver";if(d.step===3&&(!r.sd||(tdsOn(p)&&!r.tds)))return "needrc";return ""}
function deals(){if(!U)return '<div class="card">'+t("need")+' <button class="btn" id="gl">'+t("login")+'</button></div>';
if(!DE.length)return '<div class="card">'+t("nodeals")+'</div>';
return DE.map(function(d,j){var p=P[d.p],s=d.step,g=gate(d),act;
var st='<ol class="stp">'+[0,1,2,3,4,5].map(function(k){return '<li class="'+(k<s?"done":k===s?"on":"")+'">'+(k<s?"✓ ":"")+t("d"+k)+'</li>'}).join("")+'</ol>';
if(s>=6)act='<span class="badge ok">'+t("done")+'</span>';
else act=(s===0?'<label>'+t("offer")+'<input type="number" min="0" id="o'+j+'" value="'+d.price+'"></label>':'')+(g?'<p class="meta">'+t(g)+'</p>':'')+'<div class="row">'+(s===3?'<button class="btn ghost" data-x="'+d.p+'">'+t("dtax")+'</button>':'')+'<button class="btn" data-adv="'+j+'"'+(g?" disabled":"")+'>'+t(["send","acc","sign","dpd","reg","mut"][s])+'</button></div>';
return '<div class="card"><h3>'+p.loc+', '+p.dist+'</h3><div class="meta">'+t("parcel")+' '+p.id+' · '+t("seller")+': '+p.owner+' · '+inr(d.price)+'</div>'+st+act+'</div>'}).join("")}
function mapv(){var col={verified:"#1f7a45",pending:"#d19a00",flagged:"#b3261e"};
var pins=P.map(function(p,i){var o=POS[p.dist]||[250,150],x=o[0]+(i%3)*9,y=o[1]+(i%2)*9;return '<g class="pin" data-i="'+i+'"><circle cx="'+x+'" cy="'+y+'" r="11" fill="'+col[p.status]+'" stroke="#fff" stroke-width="2"/><text x="'+(x+15)+'" y="'+(y+4)+'" font-size="11" fill="currentColor">'+p.dist+'</text></g>'}).join("");
return '<div class="card"><svg class="map" viewBox="0 0 560 280" role="img" aria-label="Schematic map of Assam parcels"><path d="M10 215 C110 150 180 190 260 150 S420 120 550 60" stroke="#4a90c8" stroke-width="14" fill="none" opacity=".35"/><text x="20" y="245" font-size="11" fill="currentColor">Brahmaputra</text>'+pins+'</svg><p class="meta">'+t("mapn")+'</p><div id="mp"></div></div>'}
function check(){var p=P[sel],s=score(p);
return '<div class="row"><label><select id="ps">'+P.map(function(x,i){return '<option value="'+i+'"'+(i===sel?" selected":"")+'>'+x.id+' · '+x.loc+'</option>'}).join("")+'</select></label></div><div class="two"><div class="card"><div class="meta">'+t("score")+'</div><div class="score">'+s+'/100</div>'+badge(s>=85?"verified":s>=60?"pending":"flagged")+'<ul class="checks">'+p.c.map(function(x){return '<li><div>'+t("k"+x[0])+'<small>'+x[2]+'</small></div><span class="badge '+x[1]+'">'+t(x[1]==="ok"?"pass":x[1]==="warn"?"rev":"fail")+'</span></li>'}).join("")+'</ul><button class="btn" id="subm">'+t("submit")+'</button></div><div class="card"><svg class="map" viewBox="0 0 300 200" role="img" aria-label="Sample parcel"><path d="M20 150 C70 120 110 160 160 130 S250 150 285 110" stroke="#4a90c8" stroke-width="10" fill="none" opacity=".35"/><polygon points="105,50 190,60 200,125 112,140" fill="#3fa878" fill-opacity=".35" stroke="#17623f" stroke-width="2"/><text x="112" y="100" font-size="11" fill="currentColor">'+p.id+'</text></svg></div></div>'}
function sell(){if(!U)return '<div class="card">'+t("need")+' <button class="btn" id="gl">'+t("login")+'</button></div>';
var d=Object.keys(POS);
return '<div class="card">'+(DL?'<p><span class="badge ok">'+t("dl_ok")+'</span> <span class="meta">'+DL.name+' · '+DL.aad+'</span></p>':'')+'<div class="form"><div><label>'+t("district")+'<select id="s_d">'+d.map(function(x){return "<option>"+x+"</option>"}).join("")+'</select></label></div><div><label>'+t("f_vill")+'<input id="s_v"></label></div><div><label>'+t("f_dag")+'<input id="s_g"></label></div><div><label>'+t("f_area")+'<input id="s_a"></label></div><div><label>'+t("f_price")+'<input id="s_p" type="number" min="0"></label></div><div><label>'+t("f_owner")+'<input id="s_o" value="'+(DL?DL.name:"")+'"></label></div><div><label>'+t("f_class")+'<select id="s_c"><option value="ag">'+t("cag")+'</option><option value="res">'+t("cres")+'</option><option value="tea">'+t("ctea")+'</option></select></label></div><div><label>'+t("f_doc")+'<input type="file"></label></div></div><div class="row"><button class="btn" id="s_go">'+t("f_go")+'</button></div></div>'}
function newParcel(){var d=$("s_d").value,c=$("s_c").value,pr=+$("s_p").value||0,o=$("s_o").value.trim(),g=$("s_g").value.trim()||"000",gv=Math.round(pr*0.9);
var cn={ag:"Agricultural",res:"Residential",tea:"Tea garden"}[c];
return {id:d.slice(0,3).toUpperCase()+"-"+g,dist:d,loc:$("s_v").value.trim()||d,area:$("s_a").value.trim()||"-",price:pr,gv:gv,status:"pending",owner:o||"-",c:[
["o",o?"ok":"bad",o?"Name entered, record fetch simulated":"Owner name missing"],["m","ok","None found (simulated)"],["c",c==="tea"?"warn":"ok",c==="tea"?cn+", conversion permission needed":cn],
["p",d==="Karbi Anglong"?"warn":"ok",d==="Karbi Anglong"?"Tribal area rules apply, verify":"Outside"],["l","ok","No case linked (simulated)"],["f",(d==="Nagaon"||d==="Dhemaji")?"warn":"ok",(d==="Nagaon"||d==="Dhemaji")?"Within flood overlay":"Not flagged"]]}}
function officer(){if(U!=="officer")return '<div class="card">'+t("needo")+'</div>';
return '<div class="card table"><table><thead><tr><th>'+t("parcel")+'</th><th>'+t("seller")+'</th><th>'+t("score")+'</th><th>'+t("status")+'</th><th>'+t("taxpay")+'</th><th>'+t("action")+'</th></tr></thead><tbody>'+P.map(function(p,i){return '<tr><td>'+p.id+'</td><td>'+p.owner+'</td><td>'+score(p)+'</td><td>'+badge(p.status)+'</td><td>'+paid(p)+'</td><td><button class="btn" data-a="a'+i+'">'+t("approve")+'</button> <button class="btn ghost" data-a="r'+i+'">'+t("reject")+'</button></td></tr>'}).join("")+'</tbody></table></div>'}
function tdsOn(p){var ag=/Agricultural/.test(p.c[2][2]);return p.price>=5000000&&!(ag&&(p.tl||"urban")==="rural")}
function paid(p){var r=p.rc||{};return '<span class="badge '+(r.sd?"ok":"warn")+'">SD '+(r.sd?t("t_paid"):t("t_due"))+'</span> '+(tdsOn(p)?'<span class="badge '+(r.tds?"ok":"warn")+'">TDS '+(r.tds?t("t_paid"):t("t_due"))+'</span>':"")}
var X={sd:3,rf:2,sc:0};
function tax(){var p=P[sel];p.tl=p.tl||"urban";var r=p.rc=p.rc||{},base=Math.max(p.price,p.gv),a=base*X.sd/100,b=base*X.rf/100,c=base*X.sc/100,ag=/Agricultural/.test(p.c[2][2]),on=tdsOn(p);
function ln(k,v){return '<li><div>'+t(k)+'</div><b>'+v+'</b></li>'}
var lk='style="text-decoration:none;display:inline-block" target="_blank" rel="noopener"';
return '<div class="row"><label><select id="tps">'+P.map(function(x,i){return '<option value="'+i+'"'+(i===sel?" selected":"")+'>'+x.id+' · '+x.loc+'</option>'}).join("")+'</select></label></div><div class="two"><div class="card"><h3>'+t("t_est")+'</h3><div class="form"><div><label>'+t("t_loc")+'<select id="tl"><option value="rural"'+(p.tl==="rural"?" selected":"")+'>'+t("t_rural")+'</option><option value="urban"'+(p.tl==="urban"?" selected":"")+'>'+t("t_urban")+'</option></select></label></div><div><label>'+t("t_sd")+'<input id="x_sd" type="number" step="0.25" value="'+X.sd+'"></label></div><div><label>'+t("t_rf")+'<input id="x_rf" type="number" step="0.25" value="'+X.rf+'"></label></div><div><label>'+t("t_sc")+'<input id="x_sc" type="number" step="0.25" value="'+X.sc+'"></label></div></div><p class="meta">'+t("t_note")+'</p></div><div class="card"><ul class="checks">'+ln("t_base",inr(base))+ln("t_sda",inr(Math.round(a)))+ln("t_rfa",inr(Math.round(b)))+ln("t_sca",inr(Math.round(c)))+ln("t_tot",inr(Math.round(a+b+c)))+'</ul><p>'+(on?t("t_tds")+': <b>'+inr(Math.round(p.price*0.01))+'</b>':'<span class="meta">'+t("t_tdsna")+'</span>')+'</p><p><b>'+t("t_cg")+'</b><br><span class="meta">'+(ag&&p.tl==="rural"?t("t_cg1"):t("t_cg2"))+'</span></p><div class="row"><a class="btn" '+lk+' href="https://sewasetu.assam.gov.in">'+t("t_pay1")+'</a>'+(on?'<a class="btn ghost" '+lk+' href="https://www.incometax.gov.in">'+t("t_pay2")+'</a>':'')+'</div><label>'+t("t_rc1")+'<input id="rc1" value="'+(r.sd||"")+'"></label>'+(on?'<label>'+t("t_rc2")+'<input id="rc2" value="'+(r.tds||"")+'"></label>':'')+'<label style="margin-top:8px"><input id="dues" type="checkbox" style="width:auto" '+(r.dues?"checked":"")+'> '+t("t_dues")+'</label><div class="row"><button class="btn" id="rsave">'+t("t_save")+'</button></div></div></div>'}
function audit(){return '<div class="card"><h3>'+t("audtitle")+'</h3><p class="meta">'+t("audtext")+'</p>'+(log.length?log.map(function(l){return '<div class="log">'+l.t+' · '+l.m+' · #'+l.h+'</div>'}).join(""):'<p class="meta">'+t("noev")+'</p>')+'</div>'}
function login(){if(dlStep===1)return '<div class="card" style="max-width:460px"><h3>'+t("dl_redir")+'</h3><p>'+t("dl_title")+'</p><ul><li>'+t("dl_i1")+'</li><li>'+t("dl_i2")+'</li><li>'+t("dl_i3")+'</li></ul><div class="row"><button class="btn" id="dl_a">'+t("dl_allow")+'</button><button class="btn ghost" id="dl_d">'+t("dl_deny")+'</button></div></div>';
return '<div class="card" style="max-width:460px"><button class="btn" id="dl_go" style="width:100%;padding:12px">'+t("dl_btn")+'</button><p class="meta">'+t("dl_note")+'</p><div class="row"><button class="btn ghost" id="l_off">'+t("offd")+'</button></div></div>'}
function render(){nav();$("hero").className="hero2"+(cur==="market"?"":" compact");$("wn").textContent=t("wn");$("ls").textContent=t("sub2");$("nw").textContent=t("news");$("q").placeholder=t("sph");$("lg").innerHTML=t("name");$("tg").textContent=t("tag");$("lang").textContent=L==="en"?"অসমীয়া":"English";$("h1").innerHTML=t("wel");$("sub").textContent=t("h1");$("bn").textContent=t("bn");$("ft").textContent=t("ft");
var v=$("view");
if(cur==="market"){v.innerHTML=market();cards();[["f","d"],["fc","c"],["fm","m"],["fs","s"]].forEach(function(a){$(a[0]).onchange=function(){F[a[1]]=a[0]==="fm"?+this.value:this.value;cards()}});$("fv").onchange=function(){F.v=this.checked;cards()};$("fsv").onchange=function(){F.sv=this.checked;cards()}}
else if(cur==="map"){v.innerHTML=mapv();v.querySelectorAll(".pin").forEach(function(g){g.onclick=function(){var p=P[+g.dataset.i];$("mp").innerHTML='<h3>'+p.loc+', '+p.dist+'</h3><div class="meta">'+p.id+' · '+inr(p.price)+'</div>'+badge(p.status)+' <button class="btn ghost" id="mv">'+t("view")+'</button>';sel=+g.dataset.i;$("mv").onclick=function(){cur="check";render()}}})}
else if(cur==="check"){v.innerHTML=check();$("ps").onchange=function(){sel=+this.value;render()};$("subm").onclick=function(){var p=P[sel];addLog("Listing "+p.id+" submitted, score "+score(p));if(p.status!=="flagged")p.status="pending";if(U==="officer"){cur="officer";render()}else render()}}
else if(cur==="sell"){v.innerHTML=sell();if($("gl"))$("gl").onclick=function(){cur="login";render()};if($("s_go"))$("s_go").onclick=function(){var p=newParcel();P.push(p);sel=P.length-1;addLog("New listing "+p.id+" created, score "+score(p));cur="check";render()}}
else if(cur==="officer"){v.innerHTML=officer();v.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var i=+b.dataset.a.slice(1),ok=b.dataset.a[0]==="a";P[i].status=ok?"verified":"flagged";addLog("Officer "+(ok?"approved ":"rejected ")+P[i].id);render()}})}
else if(cur==="tax"){v.innerHTML=tax();$("tps").onchange=function(){sel=+this.value;render()};$("tl").onchange=function(){P[sel].tl=this.value;render()};["sd","rf","sc"].forEach(function(k){$("x_"+k).onchange=function(){X[k]=+this.value||0;render()}});$("rsave").onclick=function(){var q=P[sel];q.rc=q.rc||{};q.rc.sd=$("rc1").value.trim();if(tdsOn(q)&&$("rc2"))q.rc.tds=$("rc2").value.trim();q.rc.dues=$("dues").checked;addLog("Receipts recorded for "+q.id+(q.rc.sd?" SD:"+q.rc.sd:"")+(q.rc.tds?" TDS:"+q.rc.tds:""));render()}}
else if(cur==="deals"){if(U&&NQ!==null){mk(NQ);NQ=null}v.innerHTML=deals();if($("gl"))$("gl").onclick=function(){NX="deals";cur="login";render()};
v.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){sel=+b.dataset.x;cur="tax";render()}});
v.querySelectorAll("[data-adv]").forEach(function(b){b.onclick=function(){var j=+b.dataset.adv,d=DE[j],p=P[d.p];if(d.step===0){var o=+$("o"+j).value;if(!(o>0))return;d.price=o}
d.step++;addLog("Deal "+p.id+": "+D.en["d"+(d.step-1)]+" done"+(d.step===1?" at "+inr(d.price):""));if(d.step===6){p.sold=true;addLog("Parcel "+p.id+" sold and mutated")}render()}})}
else if(cur==="audit"){v.innerHTML=audit()}
else if(cur==="login"){v.innerHTML=login();if($("dl_go"))$("dl_go").onclick=function(){dlStep=1;render()};if($("dl_a"))$("dl_a").onclick=function(){dlStep=0;DL={name:"Demo Citizen",aad:"XXXX XXXX 1234"};U="citizen";addLog("Citizen signed in via DigiLocker (demo)");cur=NX||"sell";NX="";render()};if($("dl_d"))$("dl_d").onclick=function(){dlStep=0;render()};if($("l_off"))$("l_off").onclick=function(){U="officer";DL=null;addLog("Officer login");cur="officer";render()}}}
function go(){Q=$("q").value.trim().toLowerCase();cur="market";render();$("view").scrollIntoView()}$("qb").onclick=go;$("q").onkeydown=function(e){if(e.key==="Enter")go()};$("lang").onclick=function(){L=L==="en"?"as":"en";render()};
var sl=document.querySelectorAll(".sl"),si=0;setInterval(function(){sl[si].classList.remove("on");si=(si+1)%sl.length;sl[si].classList.add("on")},6000);
addLog("Prototype session started");render();
</script>
